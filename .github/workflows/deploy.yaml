name: Deploy to Minikube

on: [push]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Minikube
      uses: manusa/actions-setup-minikube@v3.0.0
      with:
        minikube version: 'latest'
        kubernetes version: 'stable'
        driver: docker
        addons: ingress

    - name: Start Minikube
      run: |
        minikube start
        minikube status

    - name: Deploy Application
      run: |
        kubectl apply -f manifests/configmap.yaml
        kubectl apply -f manifests/app-secrets.yaml

    - name: Deploy MongoDB
      run: |
        kubectl apply -f manifests/mongo-db.yaml
        kubectl wait --for=condition=Ready pod -l app=mongo --timeout=120s

    - name: Deploy Application
      run: |
        kubectl apply -f manifests/deployment.yaml
        kubectl wait --for=condition=Available deployment/app-deployment --timeout=180s
        kubectl apply -f manifests/service.yaml
        kubectl apply -f manifests/ingress.yaml

    - name: Verify
      run: kubectl get all,ingress

