name: Deploy to Minikube

on: [push]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Minikube
      uses: manusa/actions-setup-minikube@v2.14.0
      with:
        minikube version: 'v1.35.0'
        kubernetes version: 'v1.33.0'
        github token: ${{ secrets.GITHUB_TOKEN }}
        driver: docker
        addons: ingress,dashboard

    - name: Start Minikube
      run: |
        minikube start
        minikube status
        minikube addons enable ingress 
        kubectl cluster-info

    - name: Deploy Application
      run: |
        kubectl apply -f manifests/configmap.yaml
        kubectl apply -f manifests/app-secrets.yaml

    - name: Deploy MongoDB
      run: |
        kubectl apply -f manifests/mongo-db.yaml
        kubectl wait --for=condition=Ready pod -l app=mongo --timeout=300s

    - name: Deploy Configurations
      run: |
        kubectl apply -f manifests/configmap.yaml
        kubectl apply -f manifests/app-secrets.yaml
        kubectl get secrets  # Verify

    - name: Deploy Application
      run: |
        kubectl apply -f manifests/deployment.yaml
        kubectl wait --for=jsonpath='{.status.phase}'=Running pod -l app=nodeapp --timeout=300s
        kubectl wait --for=condition=ContainersReady pod -l app=nodeapp --timeout=600s || {
          echo "=== DEBUGGING ==="
          kubectl describe pods -l app=nodeapp
          kubectl logs -l app=nodeapp --tail=100
          exit 1
        }
        kubectl rollout status deployment/app-deployment  # More thorough check

    - name: Expose Application
      run: |
        kubectl apply -f manifests/service.yaml
        kubectl apply -f manifests/ingress.yaml
        minikube service list 

    - name: Verify Deployment
      run: |
        kubectl get pods -o wide
        kubectl get svc,ingress
        kubectl get endpoints  # Verify service endpoints
        
        echo "Application URL: $(minikube service nodeapp-service --url)"  

